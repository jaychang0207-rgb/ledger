<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>航班查詢</title>
<meta name="description" content="機隊航班查詢：依日期、班號、航點或機尾號查詢一年內的航班，並看每個時段的動態備機。">
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12141c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="航班查詢">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="viewTitle">航班</h1>
    <div class="sub" id="status">讀取中…</div>
  </header>

  <div id="update" class="banner" hidden>
    <span>有新版本可以使用。</span>
    <button class="ghost" id="updateBtn" type="button">立即更新</button>
  </div>
  <div id="stale" class="banner warn" hidden></div>

  <!-- ===== 航班（依日期） ===== -->
  <main id="view-day" class="view">
    <div class="datebar">
      <button class="icon-btn" id="dPrev" aria-label="前一天">‹</button>
      <label class="date-pick">
        <span class="date-label num" id="dLabel">—</span>
        <input type="date" id="dInput" aria-label="選擇日期">
      </label>
      <button class="icon-btn" id="dNext" aria-label="後一天">›</button>
      <button class="ghost" id="dToday" type="button">今天</button>
    </div>
    <div class="filters">
      <div class="seg" role="group" aria-label="基地" id="dBase">
        <button type="button" data-b="" aria-pressed="true">全部</button>
        <button type="button" data-b="TPE" aria-pressed="false">桃園</button>
        <button type="button" data-b="TSA" aria-pressed="false">松山</button>
        <button type="button" data-b="KHH" aria-pressed="false">高雄</button>
      </div>
      <label class="field grow"><span>搜尋班號、航點、機尾號或機型</span>
        <input type="search" id="dSearch" placeholder="例如 501、羽田、HND、B6505、359" enterkeyhint="search">
      </label>
    </div>
    <section class="totals" aria-label="當日統計">
      <div class="total"><span class="label">出發航班</span><span class="val num" id="dCount">0</span></div>
      <div class="total"><span class="label">使用飛機</span><span class="val num" id="dPlanes">0</span></div>
      <div class="total"><span class="label">航點</span><span class="val num" id="dDests">0</span></div>
    </section>
    <div id="dList"></div>
  </main>

  <!-- ===== 查詢（班號／航點，一年內） ===== -->
  <main id="view-find" class="view" hidden>
    <label class="field"><span>輸入班號或航點，查一年內所有日期</span>
      <input type="search" id="fSearch" placeholder="例如 081、雪梨、SYD、羽田" enterkeyhint="search">
    </label>
    <div id="fRoutes" class="chips"></div>
    <div id="fResult"></div>
  </main>

  <!-- ===== 飛機（機尾號） ===== -->
  <main id="view-plane" class="view" hidden>
    <div class="row-2">
      <label class="field"><span>機尾號</span><select id="pTail"></select></label>
      <label class="field"><span>起始日期</span><input type="date" id="pDate"></label>
    </div>
    <div id="pSummary"></div>
    <div id="pTimeline"></div>
  </main>

  <!-- ===== 備機（動態） ===== -->
  <main id="view-spare" class="view" hidden>
    <div class="row2">
      <div class="row-2">
        <label class="field"><span>日期</span><input type="date" id="sDate"></label>
        <label class="field"><span>時間（台灣）</span><input type="time" id="sTime" step="300"></label>
      </div>
      <button class="ghost self-end" id="sNow" type="button">現在</button>
    </div>
    <p class="muted small">在基地地面、且不在「出發前 60 分鐘～回到基地後 60 分鐘」內的飛機，可以立即接手。旁邊顯示可用到幾點（下一班出發前 60 分鐘）。</p>
    <div id="sList"></div>
  </main>
</div>

<nav class="tabbar" aria-label="主要分頁">
  <button type="button" data-tab="day" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>航班</span>
  </button>
  <button type="button" data-tab="find">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
    <span>查詢</span>
  </button>
  <button type="button" data-tab="plane">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3.5c0-.8.7-1.5 1.5-1.5s1.5.7 1.5 1.5V9l7.5 4.5v2L13.5 13v4.5l2.5 2V21L12 20l-4 1v-1.5l2.5-2V13L3 15.5v-2L10.5 9z"/></svg>
    <span>飛機</span>
  </button>
  <button type="button" data-tab="spare">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
    <span>備機</span>
  </button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h3 id="sheetTitle"></h3>
      <button type="button" class="ghost" id="sheetClose">關閉</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
